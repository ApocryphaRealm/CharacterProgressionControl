fDamagedAVRegenDelayNovice=-1
fDamagedAVRegenDelayApprentice=-1
fDamagedAVRegenDelayAdept=-1
fDamagedAVRegenDelayExpert=-1
fDamagedAVRegenDelayMaster=-1
fDamagedAVRegenDelayLegendary=-1

