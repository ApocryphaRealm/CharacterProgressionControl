; Character Progression Control
;
; Everything here can also be changed in game from the mod's settings pages, which is the easier
; way to do it - the page shows what each number means and what it works out to for your
; character. This file is what the game reads at startup.

[Levelling]

; Whether this mod controls what a character level costs.
; 0 = off (default). While it is off the mod writes nothing at all: your game levels exactly as
; it did before, and any other mod that sets these values keeps them.
; 1 = on. The two values below are applied when a save loads, when a new game starts, and
; whenever you change them on the page.
bOverrideLevelCost=0

; The cost of the next character level is:  fLevelUpBase + fLevelUpMult x your current level.
; Raising fLevelUpMult makes later levels progressively slower; lowering it flattens the curve.
; On first run both are filled in from whatever your own installation is using, so the page
; starts from the truth rather than from a guess.
fLevelUpBase=75.0
fLevelUpMult=25.0




[SkillExperience]

; What one USE of a skill pays toward that skill, and what a skill increase pays toward
; your character level. 0 = off (default): experience is earned exactly as in vanilla.
bOverrideSkillExp=0

; Multiplies what a skill increase pays toward your CHARACTER level. 1.0 is vanilla.
fSkillToLevelMult=1.0

; fMult<Skill> - multiplies what one use of that skill pays. 1.0 is vanilla.
fMultOneHanded=1.0
fMultTwoHanded=1.0
fMultArchery=1.0
fMultBlock=1.0
fMultSmithing=1.0
fMultHeavyArmor=1.0
fMultLightArmor=1.0
fMultPickpocket=1.0
fMultLockpicking=1.0
fMultSneak=1.0
fMultAlchemy=1.0
fMultSpeech=1.0
fMultAlteration=1.0
fMultConjuration=1.0
fMultDestruction=1.0
fMultIllusion=1.0
fMultRestoration=1.0
fMultEnchanting=1.0

[LevelUp]

; What a level up grants. 0 = off (default): a level up grants exactly what vanilla does.
bOverrideLevelUpRewards=0

; Perk points by level, as a table: "fromLevel:perks" pairs, whole numbers. "1:1" is vanilla (one perk
; every level); "1:1,20:2" gives two per level from level 20.
sPerksByLevel=1:1

; What the chosen attribute gains. Vanilla is 10 for each.
fHealthPerLevel=10.0
fMagickaPerLevel=10.0
fStaminaPerLevel=10.0

; The cross terms - carry weight gained depending on which attribute was chosen.
; Vanilla gives 5 with stamina and none with the other two. Not applied while [CarryWeight] below
; controls carry weight (the formula sets the total).
fCarryWeightPerHealth=0.0
fCarryWeightPerMagicka=0.0
fCarryWeightPerStamina=5.0

[Attributes]

; Starting health, magicka and stamina. 0 = off (default): nothing is asserted. 1 = each value below is
; applied on top of your race's own start as this mod's permanent modifier, as (value - 100), so a race
; that starts higher or lower keeps its difference; turning it off takes it away again. What a level up
; grants per attribute is fHealthPerLevel etc. under [LevelUp]. This mod also counts every attribute
; choice from the moment it is installed on a character (the game keeps no such count) for the tab's
; readout; earlier level-ups are unknown and are not guessed at.
bControlStartingAttributes=0
fStartingHealth=100.0
fStartingMagicka=100.0
fStartingStamina=100.0

[CarryWeight]

; Carry weight as a formula of your level: fStartingCarryWeight + fCarryWeightPerLevel x (level - 1),
; applied to your permanent carry weight (enchantments and spells are left alone) when a save loads, when
; you level up, when a value changes and on Apply now - nothing runs in the background. 0 = off (default):
; nothing is asserted, and anything this mod had added is taken away again. While this is on the per-choice
; carry weight under [LevelUp] is not applied - the formula sets the total. Stands down while Carryweight
; on Level Up or Carry Weight Per Level is loaded.
bControlCarryWeight=0
fStartingCarryWeight=300.0
fCarryWeightPerLevel=5.0

[Experience]

; Alternative experience sources: character experience from what you do - quests completed (by kind),
; locations discovered, locations cleared, kills, books read. 0 = off (default): nothing is granted.
; Every amount is this mod's own number; tune it against the level cost under [Levelling] (a fresh
; character's second level costs 100). Stands down while the Experience mod is loaded.
bAlternativeExperience=0

; 1 = skill increases still pay toward your level as well (supplement). 0 = they pay nothing and the
; sources below are the only way to level (replace); takes effect at the next start.
bSkillsStillPayTowardLevel=1

; Quests completed, by the kind the game gives them. Faction = the guilds, the Companions, the Dark
; Brotherhood, the civil war, the Dawnguard and Dragonborn lines. Other = quests with no kind.
fQuestMain=300.0
fQuestFaction=200.0
fQuestDaedric=250.0
fQuestSide=100.0
fQuestMisc=25.0
fQuestOther=50.0

fLocationDiscovered=30.0
fLocationCleared=80.0

; A kill by you pays fKillBase + fKillPerLevel x the victim's level. Kills by followers and summons
; count only with bCountFollowerKills=1.
fKillBase=1.0
fKillPerLevel=1.0
bCountFollowerKills=0

fBookRead=10.0
fSkillBookRead=25.0

[StaticLevelling]

; A fixed share of a skill level per use of that skill instead of vanilla scaling, so a
; skill advances at the same rate at level 5 and level 50. Each fPerUse<Skill> is a percent
; of a level: 1.0 = one use is 1% of the level, 100 uses per level. Perk bonuses to skill
; use are not applied while this is on. 0 = off (default).
bStaticLevelling=0

; SKILL POINTS: skills advance only by points spent in the level-up menu (Static Skill Leveling
; Rewritten's idea). Each level grants iSkillPointsPerLevel + fSkillPointsLevelMult x level points,
; banked when unspent (iSkillPointsCap caps the bank, 0 = no cap). The menu allows at most
; iSkillIncreasesPerLevel increases per skill per level up, and one skill level costs iSkillCost0 below
; 25, iSkillCost25 from 25, iSkillCost50 from 50, iSkillCost75 from 75. While this is on, ordinary skill
; experience is not banked and a point-spent level pays nothing toward the character level. Needs the
; skill-point level-up menu: this mod ships Interface\levelupmenu.swf (Static Skill Leveling Rewritten's
; vanilla-look menu, with its authors' permission); its other skins fit too. 0 = off (default).
bSkillPoints=0
iSkillPointsPerLevel=15
fSkillPointsLevelMult=2.0
iSkillPointsCap=0
iSkillIncreasesPerLevel=5
iSkillCost0=3
iSkillCost25=5
iSkillCost50=7
iSkillCost75=9

fPerUseOneHanded=1.0
fPerUseTwoHanded=1.0
fPerUseArchery=1.0
fPerUseBlock=1.0
fPerUseSmithing=1.0
fPerUseHeavyArmor=1.0
fPerUseLightArmor=1.0
fPerUsePickpocket=1.0
fPerUseLockpicking=1.0
fPerUseSneak=1.0
fPerUseAlchemy=1.0
fPerUseSpeech=1.0
fPerUseAlteration=1.0
fPerUseConjuration=1.0
fPerUseDestruction=1.0
fPerUseIllusion=1.0
fPerUseRestoration=1.0
fPerUseEnchanting=1.0

[Enchanting]

; How the cost of using an enchanted item scales with your Enchanting skill. This is the
; equation that breaks when Enchanting is uncapped, which is why it sits beside the skill caps.
; 0 = off (default): the values your install came with are restored and left alone.
bOverrideEnchanting=0

; Filled in from your own installation on first run. Lower values make an enchanted item
; cheaper to use; the exponent is the one that runs away once the skill climbs past 100.
fEnchantingCostBase=0.0
fEnchantingCostScale=0.0
fEnchantingCostMult=0.0
fEnchantingCostExponent=0.0

[Skills]

; Whether this mod controls skill caps. 0 = off (default): every skill behaves exactly as
; vanilla and this mod asserts nothing about it.
; The skill cap patch is real as of 1.0.1: with bOverrideSkillCaps=1 each skill stops advancing at
; its fCap<Skill> below, and (since 1.0.2) the game's own formulas read at most fFormulaCap<Skill> for
; it - both verified in game on Skyrim SE 1.5.97. The Patches page says whether each is active.
bOverrideSkillCaps=0

; fCap<Skill>        - the level the skill stops advancing at. 100 is vanilla.
; fFormulaCap<Skill> - the value the game's own calculations read for that skill, however
;                      high the skill itself reads. Leaving this at 100 keeps combat and
;                      prices balanced while the skill number keeps climbing.

fCapOneHanded=100.0
fFormulaCapOneHanded=100.0
fCapTwoHanded=100.0
fFormulaCapTwoHanded=100.0
fCapArchery=100.0
fFormulaCapArchery=100.0
fCapBlock=100.0
fFormulaCapBlock=100.0
fCapSmithing=100.0
fFormulaCapSmithing=100.0
fCapHeavyArmor=100.0
fFormulaCapHeavyArmor=100.0
fCapLightArmor=100.0
fFormulaCapLightArmor=100.0
fCapPickpocket=100.0
fFormulaCapPickpocket=100.0
fCapLockpicking=100.0
fFormulaCapLockpicking=100.0
fCapSneak=100.0
fFormulaCapSneak=100.0
fCapAlchemy=100.0
fFormulaCapAlchemy=100.0
fCapSpeech=100.0
fFormulaCapSpeech=100.0
fCapAlteration=100.0
fFormulaCapAlteration=100.0
fCapConjuration=100.0
fFormulaCapConjuration=100.0
fCapDestruction=100.0
fFormulaCapDestruction=100.0
fCapIllusion=100.0
fFormulaCapIllusion=100.0
fCapRestoration=100.0
fFormulaCapRestoration=100.0
fCapEnchanting=100.0
fFormulaCapEnchanting=100.0

[Difficulty]

; One configuration per game difficulty. 1 = the difficulty set in the game's own Settings decides
; which of six presets is in use (Difficulty - Novice, Apprentice, Adept, Expert, Master,
; Legendary, in the Presets folder) and changing it switches them: what you had is saved into the
; old difficulty's preset and the new one's is loaded. 0 = the Presets page's own selection applies.
bFollowDifficulty=0

; Difficulty by level (Yet Another Difficulty Mod's Dynamic mode). 1 = on a save load and on every level-up the
; highest difficulty whose level you have reached becomes the game's difficulty - the same change the Settings
; menu makes. 0 = off (default). The levels below: the level from which each difficulty applies; 0 = that
; difficulty is never chosen by the rule. Defaults are Blade and Blunt's milestones, one tier per ten levels.
bDifficultyByLevel=0
uLevelForNovice=1
uLevelForApprentice=10
uLevelForAdept=20
uLevelForExpert=30
uLevelForMaster=40
uLevelForLegendary=50

[Damage]

; The damage multipliers per difficulty - Custom Difficulty UI's mechanic, here as the Difficulty tab (that
; mod stays a separate minimal one; this tab stands down while it is loaded). 0 = off (default): NOTHING is
; written - the values your game loaded with (vanilla, or an overhaul's such as Blade and Blunt's or
; Requiem's) stay as they are. 1 = the pairs below are written; the difficulty you play on picks. With an
; overhaul loaded this mod writes last and supersedes it; the page has presets for Blade and Blunt, Requiem
; and the loaded values.
bControlDamage=0

; One pair for every difficulty (Yet Another Difficulty Mod's Simple mode). 1 = the single pair below is written
; for all six difficulties instead of the table. 0 = each difficulty has its own pair (default).
bSharedPair=0
fSharedDamageToPlayer=1.0
fSharedDamageByPlayer=1.0

; Damage dealt TO you / BY you, per difficulty. Vanilla: 0.5 0.75 1 1.5 2 3 to you; 2 1.5 1 0.75 0.5 0.25 by you.
fDamageToPlayerNovice=0.5
fDamageToPlayerApprentice=0.75
fDamageToPlayerAdept=1.0
fDamageToPlayerExpert=1.5
fDamageToPlayerMaster=2.0
fDamageToPlayerLegendary=3.0

fDamageByPlayerNovice=2.0
fDamageByPlayerApprentice=1.5
fDamageByPlayerAdept=1.0
fDamageByPlayerExpert=0.75
fDamageByPlayerMaster=0.5
fDamageByPlayerLegendary=0.25

[Regeneration]

; Vanilla has ONE set of regeneration values for every difficulty. Here each difficulty has its own set of the
; seven settings below, and the set for the difficulty you play on is written into the game - switched when the
; difficulty changes in the game's Settings. 0 = off (default): the values your game came with are restored.
; -1 means "not captured yet": the mod replaces it with your own game's real value the first time it loads,
; for every difficulty, so a fresh install is identical on every difficulty until you change something.
bControlRegeneration=0

fCombatHealthRegenRateMultNovice=-1
fCombatHealthRegenRateMultApprentice=-1
fCombatHealthRegenRateMultAdept=-1
fCombatHealthRegenRateMultExpert=-1
