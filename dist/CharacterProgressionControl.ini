fCombatMagickaRegenRateMultLegendary=-1

fCombatStaminaRegenRateMultNovice=-1
fCombatStaminaRegenRateMultApprentice=-1
fCombatStaminaRegenRateMultAdept=-1
fCombatStaminaRegenRateMultExpert=-1
fCombatStaminaRegenRateMultMaster=-1
fCombatStaminaRegenRateMultLegendary=-1

fDamagedHealthRegenDelayNovice=-1
fDamagedHealthRegenDelayApprentice=-1
fDamagedHealthRegenDelayAdept=-1
fDamagedHealthRegenDelayExpert=-1
fDamagedHealthRegenDelayMaster=-1
fDamagedHealthRegenDelayLegendary=-1

fDamagedMagickaRegenDelayNovice=-1
fDamagedMagickaRegenDelayApprentice=-1
fDamagedMagickaRegenDelayAdept=-1
fDamagedMagickaRegenDelayExpert=-1
fDamagedMagickaRegenDelayMaster=-1
