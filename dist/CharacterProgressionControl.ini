; Character Progression Control
;
; Everything here can also be changed in game from the mod's settings pages, which is the easier
; way to do it - the page shows what each number means and what it works out to for your
; character. This file is what the game reads at startup.

[Levelling]

; Whether this mod controls what a character level costs.
; 0 = off (default). While it is off the mod writes nothing at all: your game levels exactly as
; it did before, and any other mod that sets these values keeps them.
; 1 = on. The two values below are applied when a save loads, when a new game starts, and
; whenever you change them on the page.
bOverrideLevelCost=0

; The cost of the next character level is:  fLevelUpBase + fLevelUpMult x your current level.
; Raising fLevelUpMult makes later levels progressively slower; lowering it flattens the curve.
; On first run both are filled in from whatever your own installation is using, so the page
; starts from the truth rather than from a guess.
fLevelUpBase=75.0
fLevelUpMult=25.0

[Debug]

; 0 trace, 1 debug, 2 info, 3 warning, 4 error, 5 critical, 6 off.
; The log is at Documents\My Games\Skyrim Special Edition\SKSE\CharacterProgressionControl.log.
uLogLevel=0
